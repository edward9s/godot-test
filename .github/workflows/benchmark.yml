name: Benchmark protocol tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s benchmark -p 'test_*.py'
      - name: Audited Godot protocol unit tests
        run: |
          curl -fLsS --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script scripts/test_benchmark.gd 2>&1 | tee "$RUNNER_TEMP/protocol.log"
          grep -F 'Benchmark protocol passed:' "$RUNNER_TEMP/protocol.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/protocol.log"; then exit 1; fi
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script scripts/test_benchmark_boundary.gd 2>&1 | tee "$RUNNER_TEMP/boundary.log"
          grep -F 'Benchmark boundary passed:' "$RUNNER_TEMP/boundary.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/boundary.log"; then exit 1; fi
