name: Vulkan tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-vulkan-tests
  cancel-in-progress: false

jobs:
  vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot/releases/download/$version-stable"
          curl -fLsS --retry 3 "$base/Godot_v$version-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v$version-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot" --version

      - name: Generate exact source geometry and PBR textures
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/prepare_scene.py
          python3 scripts/check_scene.py
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -isystem .deps/host/filament/include \
            tests/rocks.cpp -o /tmp/godot-forest-rocks
          /tmp/godot-forest-rocks

      - name: Import scene assets
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot" --headless --path . --editor --import --quit
          find .godot/imported -name '*forest.glb*' -print | grep -q .

      - name: Validate Vulkan stability and GPU uploads
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb xauth
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -s "$VK_ICD_FILENAMES"
          for renderer in mobile forward_plus; do
            scene_log="$RUNNER_TEMP/vulkan-$renderer-scene.log"
            effects_log="$RUNNER_TEMP/vulkan-$renderer-effects.log"
            timeout 60s xvfb-run -a "$RUNNER_TEMP/godot" --path . --rendering-driver vulkan \
              --rendering-method "$renderer" --audio-driver Dummy --script scripts/test_scene.gd \
              2>&1 | tee "$scene_log"
            grep -F 'Scene passed:' "$scene_log"
            timeout 300s xvfb-run -a "$RUNNER_TEMP/godot" --path . --rendering-driver vulkan \
              --rendering-method "$renderer" --audio-driver Dummy --script scripts/test_stability.gd \
              -- effects 3600 "$renderer" 2>&1 | tee "$effects_log"
            timeout 600s xvfb-run -a "$RUNNER_TEMP/godot" --path . --rendering-driver vulkan \
              --rendering-method "$renderer" --audio-driver Dummy --script scripts/test_stability.gd \
              -- scene 180 "$renderer" 2>&1 | tee -a "$scene_log"
            grep -F 'Stability passed: effects 3600' "$effects_log"
            grep -F 'Stability passed: scene 180' "$scene_log"
            scale_log="$RUNNER_TEMP/vulkan-$renderer-scale.log"
            timeout 180s xvfb-run -a "$RUNNER_TEMP/godot" --path . --rendering-driver vulkan \
              --rendering-method "$renderer" --audio-driver Dummy --script scripts/test_render_scale.gd \
              2>&1 | tee "$scale_log"
            grep -F 'Render scale passed:' "$scale_log"
            if grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:' "$effects_log" "$scene_log" "$scale_log"; then
              exit 1
            fi
          done

